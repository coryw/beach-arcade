<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1c2c">
<title>Crab Climb DX</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>">
<style>
/* gk.css — the shell every game sits in. Fullscreen canvas, no scroll, no zoom, safe on iOS. */
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
canvas#game { display: block; position: fixed; inset: 0; touch-action: none; image-rendering: pixelated; }
#rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0f172a; color: #fff; font: 700 28px system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
@media (orientation: portrait) and (pointer: coarse) { body[data-orient="landscape"] #rotate { display: flex; } }
@media (orientation: landscape) and (pointer: coarse) { body[data-orient="portrait"] #rotate { display: flex; } }
/* kit 2: the page takes the game's own palette and face (GK.start sets --gk-*), and nothing is drawn under the notch. */
body[data-kit="2"], html:has(body[data-kit="2"]) { background: var(--gk-bg, #000); }
body[data-kit="2"] #rotate { background: var(--gk-bg, #000); color: var(--gk-ink, #fff); font: 900 28px var(--gk-font, system-ui);
  padding: calc(24px + var(--sa-top-override, env(safe-area-inset-top, 0px))) calc(24px + var(--sa-right-override, env(safe-area-inset-right, 0px)))
           calc(24px + var(--sa-bottom-override, env(safe-area-inset-bottom, 0px))) calc(24px + var(--sa-left-override, env(safe-area-inset-left, 0px))); }
#gk-safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none; }

</style>
</head>
<body data-orient="landscape">
<div id="rotate">↻ Crab Climb DX</div>
<canvas id="game"></canvas>
<script>
/*! gk.js v2 — the game-maker 2D kit. One file, no dependencies, no build step. Global: window.GK.
 *  Canvas 2D · fixed-step loop (hitstop, slowmo) · test hooks (render_game_to_text, advanceTime, __arcade) ·
 *  seeded RNG · keyboard + touch + gamepad · scenes + transitions · tilemaps + platformer · sprites · tweens ·
 *  painters, parallax, light, post · particles + trails · synthesized sfx + songs · high scores.
 *  kit 1 (the default) is every legacy game, unchanged. GK.start({kit: 2, theme, view, ...}) opts into the identity
 *  layer: no shared title, game-over, banner or control skin — the game draws its own. API: kit/README.md.
 */
(function () {
  "use strict";
  const GK = { version: "2.0.0", kit: 1, ready: false, lastError: null,
               stats: { frames: 0, renders: 0, time: 0, stepMs: 0, inputs: {} } };
  const STEP = 1 / 60, TAU = Math.PI * 2;
  let opts = {}, K2 = false, theme = null;

  // ───────────────────────────── URL parameters (§3.1) ─────────────────────────────
  // ?seed=N ?arcade=1 ?q=N ?nobloom=1 ?god=1 ?at=<stage> ?sa=T,R,B,L — the names every v2 game honors.
  const qs = new URLSearchParams(location.search);
  const num = (k) => (qs.has(k) && qs.get(k) !== "" && isFinite(+qs.get(k)) ? +qs.get(k) : null);
  const flag = (k) => qs.has(k) && qs.get(k) !== "0" && qs.get(k) !== "false";
  const saRaw = qs.has("sa") ? qs.get("sa").split(",").map(Number) : null;
  GK.params = { seed: num("seed"), arcade: flag("arcade"), q: num("q"), nobloom: flag("nobloom"), god: flag("god"),
                at: qs.get("at"), sa: saRaw && saRaw.length === 4 && saRaw.every(isFinite) ? saRaw : null, raw: qs };

  // ───────────────────────────── random & math ─────────────────────────────
  // Game randomness is Math.random until GK.seed(n) (or ?seed=N) switches it to mulberry32 — and then Math.random is
  // patched too, so game code that calls it directly is deterministic under the gate. Kit visuals (shake, grain,
  // tiles, stars, sfx variation) never draw from this stream: they use hash noise, so rendering cannot shift the game.
  let rnd = Math.random;
  const mulberry32 = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  GK.rng = mulberry32;
  GK.seed = (n) => { rnd = mulberry32(Math.floor(Number(n)) || 0); Math.random = rnd; return rnd; };
  if (GK.params.seed !== null) GK.seed(GK.params.seed);
  GK.random = () => rnd();
  GK.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  GK.lerp = (a, b, t) => a + (b - a) * t;
  GK.rand = (a = 1, b) => (b === undefined ? rnd() * a : a + rnd() * (b - a));
  GK.randInt = (a, b) => Math.floor(GK.rand(a, b + 1));
  GK.pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  GK.chance = (p) => rnd() < p;
  GK.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  GK.angleTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
  GK.wrap = (v, min, max) => (v < min ? max - (min - v) : v > max ? min + (v - max) : v);
  GK.sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
  GK.approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  const mod = (a, n) => ((a % n) + n) % n;

  // hash noise: deterministic, never touches the game's random stream. noise1/noise2 return 0..1.
  const hash2 = (x, y) => { let h = Math.imul(x | 0, 374761393) ^ Math.imul((y | 0) + 0x9E3779B9, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const smooth = (t) => t * t * (3 - 2 * t);
  GK.noise1 = (x) => { const i = Math.floor(x); return GK.lerp(hash2(i, 0), hash2(i + 1, 0), smooth(x - i)); };
  GK.noise2 = (x, y) => { const i = Math.floor(x), j = Math.floor(y), fx = smooth(x - i), fy = smooth(y - j);
    return GK.lerp(GK.lerp(hash2(i, j), hash2(i + 1, j), fx), GK.lerp(hash2(i, j + 1), hash2(i + 1, j + 1), fx), fy); };
  const noiseP = (x, period, seed) => { const i = Math.floor(x); return GK.lerp(hash2(mod(i, period), seed), hash2(mod(i + 1, period), seed), smooth(x - i)); };
  const fbmP = (x, period, seed, oct = 3) => { let v = 0, a = 0.5, f = 1, n = 0; for (let o = 0; o < oct; o++) { v += a * noiseP(x * f, period * f, seed + o * 17); n += a; a *= 0.5; f *= 2; } return v / n; };

  GK.ease = {
    linear: (t) => t, quadIn: (t) => t * t, quadOut: (t) => t * (2 - t), quadInOut: (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2),
    cubicIn: (t) => t * t * t, cubicOut: (t) => 1 - (1 - t) ** 3, cubicInOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2),
    sineInOut: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    backIn: (t) => 2.70158 * t * t * t - 1.70158 * t * t, backOut: (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
    elasticOut: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
    bounceOut: (t) => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
  };

  // colors: parse "#rgb" "#rrggbb" "#rrggbbaa" "rgb()/rgba()" → {r,g,b,a}; mix two colors; lighten (+) / darken (−)
  const colorCache = new Map();
  GK.color = (c) => {
    if (colorCache.has(c)) return colorCache.get(c); let r = 255, g = 255, b = 255, a = 1, m;
    if (typeof c === "string" && c[0] === "#") { let h = c.slice(1); if (h.length <= 4) h = [...h].map((x) => x + x).join("");
      r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16); if (h.length >= 8) a = parseInt(h.slice(6, 8), 16) / 255; }
    else if (typeof c === "string" && (m = /rgba?\(([^)]+)\)/.exec(c))) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(parseFloat); [r, g, b] = p; if (p.length > 3) a = p[3]; }
    const o = { r, g, b, a }; if (colorCache.size < 512) colorCache.set(c, o); return o;
  };
  const hex2 = (v) => Math.round(GK.clamp(v, 0, 255)).toString(16).padStart(2, "0");
  GK.mix = (c1, c2, t) => { const a = GK.color(c1), b = GK.color(c2), al = GK.lerp(a.a, b.a, t);
    return "#" + hex2(GK.lerp(a.r, b.r, t)) + hex2(GK.lerp(a.g, b.g, t)) + hex2(GK.lerp(a.b, b.b, t)) + (al < 1 ? hex2(al * 255) : ""); };
  GK.shade = (c, amt) => GK.mix(c, amt >= 0 ? "#ffffff" : "#000000", Math.abs(amt));
  GK.alpha = (c, a) => { const o = GK.color(c); return `rgba(${o.r},${o.g},${o.b},${a * o.a})`; };

  // center-of-box helpers (entities are {x,y,w,h}; x,y is the TOP-LEFT corner)
  GK.cx = (e) => e.x + e.w / 2;
  GK.cy = (e) => e.y + e.h / 2;
  GK.hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  GK.hitCircle = (a, b) => Math.hypot(GK.cx(a) - GK.cx(b), GK.cy(a) - GK.cy(b)) < (a.r || Math.min(a.w, a.h) / 2) + (b.r || Math.min(b.w, b.h) / 2);
  GK.contains = (e, px, py) => px >= e.x && px <= e.x + e.w && py >= e.y && py <= e.y + e.h;
  GK.inBounds = (e, pad = 0) => e.x + e.w >= -pad && e.x <= GK.width + pad && e.y + e.h >= -pad && e.y <= GK.height + pad;

  // ───────────────────────────── canvas, view & sizing ─────────────────────────────
  // view.mode: "fit" (kit 1 and default: fixed logical size, letterboxed) · "expand" (short side fixed, the long side
  // grows up to maxAspect, so a phone has no bars; GK.width/GK.height change and opts.onResize(w, h) runs) ·
  // "pixel" (a width×height buffer, integer upscale, nearest-neighbour).
  let canvas, mainCtx, ctx, dpr = 1, scale = 1, offX = 0, offY = 0, viewW = 0, viewH = 0, buf = null, bufCtx = null;
  let tgt = { ox: 0, oy: 0, w: 1, h: 1 }, baseT = [1, 0, 0, 1, 0, 0];
  GK.width = 800; GK.height = 450; GK.cam = { x: 0, y: 0, zoom: 1, rot: 0 };
  GK.view = { mode: "fit" };
  GK.isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  const isPixel = () => GK.view.mode === "pixel";

  function resize() {
    viewW = window.innerWidth; viewH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(viewW * dpr); canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + "px"; canvas.style.height = viewH + "px";
    const v = GK.view, pw = GK.width, ph = GK.height;
    if (v.mode === "expand") {
      if (v.orient === "portrait") { GK.width = v.width; GK.height = Math.round(GK.clamp(v.width * viewH / viewW, v.height, v.width * v.maxAspect)); }
      else { GK.height = v.height; GK.width = Math.round(GK.clamp(v.height * viewW / viewH, v.width, v.height * v.maxAspect)); }
    }
    const fitScale = Math.min(viewW / GK.width, viewH / GK.height);
    scale = v.mode === "pixel" && fitScale >= 1 ? Math.floor(fitScale) : fitScale;
    offX = (viewW - GK.width * scale) / 2; offY = (viewH - GK.height * scale) / 2;
    if (v.mode === "pixel") { offX = Math.floor(offX); offY = Math.floor(offY); }
    GK.scale = scale;
    if (document.body) readSafe();
    if (K2) buildControls();
    if ((pw !== GK.width || ph !== GK.height || !resize.done) && opts.onResize) { try { opts.onResize(GK.width, GK.height); } catch (e) { fail(e); } }
    resize.done = true;
  }
  GK.toGame = (clientX, clientY) => ({ x: (clientX - offX) / scale, y: (clientY - offY) / scale });
  // The painted view in CSS px. With letterbox ART (theme.letterbox is a function) the game paints the whole screen.
  GK.viewRect = () => (K2 && typeof theme.letterbox === "function" ? { x: 0, y: 0, w: viewW, h: viewH } : { x: offX, y: offY, w: GK.width * scale, h: GK.height * scale });

  // Safe-area insets from a probe div (env(safe-area-inset-*)); ?sa=T,R,B,L fakes them through --sa-*-override.
  // GK.safeCss = the screen's insets in CSS px; GK.safe = how far they reach INTO the view, in logical px.
  GK.safe = { top: 0, right: 0, bottom: 0, left: 0 }; GK.safeCss = { top: 0, right: 0, bottom: 0, left: 0 };
  let safeProbe = null;
  function readSafe() {
    if (!safeProbe) {
      safeProbe = document.createElement("div"); safeProbe.id = "gk-safe";
      safeProbe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
        ["top", "right", "bottom", "left"].map((k) => `padding-${k}:var(--sa-${k}-override, env(safe-area-inset-${k}, 0px))`).join(";");
      document.body.appendChild(safeProbe);
    }
    if (GK.params.sa) ["top", "right", "bottom", "left"].forEach((k, i) => document.documentElement.style.setProperty(`--sa-${k}-override`, GK.params.sa[i] + "px"));
    const cs = getComputedStyle(safeProbe), px = (k) => parseFloat(cs[`padding${k}`]) || 0;
    const s = { top: px("Top"), right: px("Right"), bottom: px("Bottom"), left: px("Left") }; GK.safeCss = s;
    const vw = GK.width * scale, vh = GK.height * scale;
    GK.safe = { top: Math.max(0, s.top - offY) / scale, left: Math.max(0, s.left - offX) / scale,
                bottom: Math.max(0, s.bottom - (viewH - offY - vh)) / scale, right: Math.max(0, s.right - (viewW - offX - vw)) / scale };
  }
  // A point inside the view that stays clear of the safe-area insets: HUD placement. corner: tl tr bl br t b l r c.
  GK.anchor = (corner = "tl", dx = 0, dy = 0) => {
    const s = GK.safe, W = GK.width, H = GK.height, c = corner;
    const x = c.includes("l") ? s.left + dx : c.includes("r") ? W - s.right - dx : W / 2 + dx;
    const y = c.includes("t") ? s.top + dy : c.includes("b") ? H - s.bottom - dy : H / 2 + dy;
    return { x, y };
  };

  // ───────────────────────────── input ─────────────────────────────
  // Names: left right up down a b start.  key = ANY player; p1/p2 = specific players.
  // Every key action, virtual-button hit, zone touch, stick drag and tap is counted in GK.stats.inputs[name].
  const KEYMAP = {
    any: { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
           KeyA: "left", KeyD: "right", KeyW: "up", KeyS: "down",
           Space: "a", KeyZ: "a", KeyJ: "a", KeyF: "a", KeyK: "b", KeyX: "b", KeyG: "b", ShiftLeft: "b", ShiftRight: "b", KeyL: "b",
           Enter: "start", NumpadEnter: "start", Escape: "start" },
    p1:  { KeyA: "left", KeyD: "right", KeyW: "up", KeyS: "down", KeyF: "a", KeyG: "b", Space: "a", Enter: "start" },
    p2:  { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", KeyK: "a", KeyL: "b", Slash: "a", Period: "b", Enter: "start" },
  };
  function makeInput() {
    const held = new Set(), pressed = new Set(), released = new Set();
    return {
      held: (n) => held.has(n), pressed: (n) => pressed.has(n), released: (n) => released.has(n),
      axisX() { return (held.has("right") ? 1 : 0) - (held.has("left") ? 1 : 0); },
      axisY() { return (held.has("down") ? 1 : 0) - (held.has("up") ? 1 : 0); },
      _down(n) { if (!held.has(n)) pressed.add(n); held.add(n); },
      _up(n) { if (held.has(n)) released.add(n); held.delete(n); },
      _tick() { pressed.clear(); released.clear(); },
      _clear() { held.clear(); pressed.clear(); released.clear(); },
    };
  }
  GK.key = makeInput(); GK.p1 = makeInput(); GK.p2 = makeInput();
  GK.anyPressed = () => ["a", "b", "start"].some((n) => GK.key.pressed(n)) || GK.pointer.justDown;
  GK.pointer = { x: 0, y: 0, down: false, justDown: false, justUp: false };
  GK.touches = []; // [{id,x,y}] live touches in game coords (excludes virtual-control touches)
  const touchQueue = []; // taps this frame: [{x,y}]
  GK.taps = [];
  const count = (n) => { GK.stats.inputs[n] = (GK.stats.inputs[n] || 0) + 1; };

  function keyDown(e) {
    if (e.repeat) return;
    if (KEYMAP.any[e.code]) count(KEYMAP.any[e.code]);
    for (const who of ["any", "p1", "p2"]) { const n = KEYMAP[who][e.code]; if (n) GK[who === "any" ? "key" : who]._down(n); }
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    unlockAudio();
  }
  function keyUp(e) {
    for (const who of ["any", "p1", "p2"]) { const n = KEYMAP[who][e.code]; if (n) GK[who === "any" ? "key" : who]._up(n); }
  }

  // gamepads: pad 0 → p1 (+any), pad 1 → p2 (+any)
  const padState = [{}, {}];
  function pollPads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < 2; i++) {
      const pad = pads && pads[i]; const who = i === 0 ? GK.p1 : GK.p2; if (!pad) continue;
      const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
      const now = {
        left: ax < -0.5 || (pad.buttons[14] && pad.buttons[14].pressed), right: ax > 0.5 || (pad.buttons[15] && pad.buttons[15].pressed),
        up: ay < -0.5 || (pad.buttons[12] && pad.buttons[12].pressed), down: ay > 0.5 || (pad.buttons[13] && pad.buttons[13].pressed),
        a: pad.buttons[0] && pad.buttons[0].pressed, b: (pad.buttons[1] && pad.buttons[1].pressed) || (pad.buttons[2] && pad.buttons[2].pressed),
        start: pad.buttons[9] && pad.buttons[9].pressed,
      };
      for (const n in now) {
        if (now[n] && !padState[i][n]) { who._down(n); GK.key._down(n); count(n); }
        if (!now[n] && padState[i][n]) { who._up(n); GK.key._up(n); }
      }
      padState[i] = now;
    }
  }

  // ───────────────────────────── virtual touch controls ─────────────────────────────
  // layouts: 'dpad+ab' (default) · 'lr+a' (left/right + jump) · 'joystick+ab' · 'tap' (none drawn) · 'none'
  // kit 1: buttons live in GAME coords (the legacy positions). kit 2: buttons live in CSS px, anchored to the screen's
  // thumb corners outside the safe-area insets, and the game's skin function draws them. `zones` are invisible touch
  // regions that press an action while held (view fractions).
  const vc = { layout: "dpad+ab", buttons: [], zones: [], zoneSpecs: [], active: {}, stick: null, visible: false, touched: false,
               space: "game", skin: null, labels: {}, icons: {}, floating: false, opacity: 0.55, size: 1 };
  const LEGACY_LABEL = { left: "◀", right: "▶", up: "▲", down: "▼", a: "A", b: "B" };
  function buildControls() {
    const held = vc.stick && vc.stick.id !== null ? vc.stick : null;
    vc.buttons = []; vc.stick = null;
    if (vc.space === "css") buildControlsCss();
    else {
      const W = GK.width, H = GK.height, r = 34;
      if (vc.layout === "dpad+ab" || vc.layout === "joystick+ab") {
        if (vc.layout === "dpad+ab") {
          const cx = 90, cy = H - 90, d = 52;
          vc.buttons.push({ n: "left", x: cx - d, y: cy, r, label: "◀" }, { n: "right", x: cx + d, y: cy, r, label: "▶" },
                          { n: "up", x: cx, y: cy - d, r, label: "▲" }, { n: "down", x: cx, y: cy + d, r, label: "▼" });
        } else vc.stick = { cx: 100, cy: H - 100, r: 60, dx: 0, dy: 0, id: null };
        vc.buttons.push({ n: "a", x: W - 70, y: H - 70, r: 38, label: "A" }, { n: "b", x: W - 150, y: H - 110, r: 32, label: "B" });
      } else if (vc.layout === "lr+a") {
        vc.buttons.push({ n: "left", x: 70, y: H - 70, r: 40, label: "◀" }, { n: "right", x: 170, y: H - 70, r: 40, label: "▶" },
                        { n: "a", x: W - 70, y: H - 70, r: 44, label: "A" });
      }
      for (const b of vc.buttons) { b.kind = "button"; if (vc.labels[b.n] !== undefined) b.label = vc.labels[b.n]; b.icon = vc.icons[b.n] ?? null; }
    }
    if (held && vc.stick) Object.assign(vc.stick, { dx: held.dx, dy: held.dy, id: held.id, counted: held.counted });
    vc.zones = vc.zoneSpecs.map((z) => ({ n: z.n, rect: z.rect }));

<script>
// Crab Climb DX — the platformer-2d exemplar · look "Pocket Pixel '89" (pixel-retro) · climax: escape (the tide)
// A 320×180 pixel buffer (view.mode "pixel", integer upscale) on gk kit 2. Three levels; each adds ONE thing:
// jellyfish springs → sandcastle blocks that crumble → driftwood rafts that move. Signature: the crab SCUTTLES
// sideways up any wall (it replaces the double jump), and the sea is a live pixel layer whose waterline rises.
// Regions: STRUCTURE is what the platformer recipe copies · ART is this game's alone · CLIMAX is the polish layer.

// ── STRUCTURE ──
const P = ["#1a1c2c", "#5d275d", "#ef7d57", "#ffcd75", "#73eff7"];      // night · plum · sunset · sand · sea (the art direction)
const FONT_FAMILY = "Press Start 2P", FONT_URL = "../../vendor/fonts/press-start-2p/press-start-2p-latin-400.woff2";
const TILE = 16, GOD = !!GK.params.god;
// The feel constant, tuned first: apex 0.36 s at 3.3 tiles (v = 2h/t, g = v/t). Everything else hangs off it.
const FEEL = { speed: 96, accel: 900, jump: 290, gravity: 800, fallMul: 1.6, maxFall: 330, coyote: 0.1, buffer: 0.12,
               climb: 70, slide: 22, kick: 120, spring: 470, stomp: 230, stompHeld: 330 };
const SOLID = "#%c", ONEWAY = "-";

// Legend: # sand-crusted rock · % barnacle cliff · c sandcastle block (crumbles) · - driftwood plank (one-way)
//         P crab · F sandcastle flag · o shell · * pearl · g gull (walks) · h gull (hovers) · x urchin · j jellyfish spring
//         r raft sliding sideways · v raft riding up and down
const LEVELS = [
  { name: "LOW TIDE", adds: "JELLYFISH SPRINGS", time: 70, water: [11.5, 10.35], rows: [
      "................................................................................................................",
      "................................................................................................................",
      "................................................................................................................",
      ".........................................o.o.......................................*............................",
      "......................................%%%%%%%%..................................######..........................",
      ".....................................o%%%%%%%%.................................................o................",
      "..................o.o................o%%%%%%%%..g.....o.o.......oo..........h..............o...%%...............",
      "............................ooo......o%%%%%%%%####...------...------.......................%%..%%..o............",
      "......o.o.o.....%%%%%%%..............o%%%%%%%%####.........................................%%..%%..%%...........",
      "..P.............%%%%%%%..g.......j....%%%%%%%%####.............x..x...........j........g...%%..%%..%%...g...F...",
      "################%%%%%%%#####...#######%%%%%%%%######........##########...##################%%..%%..%%###########",
      "################%%%%%%%#####...#######%%%%%%%%######........##########...##################%%..%%..%%###########",
      "################%%%%%%%#####...#######%%%%%%%%######........##########...##################%%..%%..%%###########"
  ] },
  { name: "SANDCASTLE SHOALS", adds: "CRUMBLY CASTLES", time: 70, water: [12.5, 11.35], rows: [
      "....................................................................................................................",
      "....................................................................................................................",
      "..............................................................*.....................................................",
      ".............................................................%%%%...................................................",
      "...................................h........................o%%%%...................................................",
      ".............................................................%%%%......o.o.o...................o....................",
      "..................................o.o.......................o%%%%####cccccccc..................%%...................",
      "............................%%%%cccccc%%%%%..oo..............%%%%####.............h.........ccc%%...................",
      "...........................o%%%%......%%%%%.cccc............o%%%%####..................%%......%%.o...o...o.........",
      ".....o.o.o....o.o.o........o%%%%......%%%%%..................%%%%####..................%%ccc...%%...................",
      "..P.....................g...%%%%......%%%%%..x...........j.g.%%%%####...........x...g..%%......%%...x...g......F....",
      "#############cccccccc#######%%%%......%%%%%########...#######%%%%####........##########%%......%%###################",
      "#############........#######%%%%......%%%%%########...#######%%%%####........##########%%......%%###################",
      "#############........#######%%%%......%%%%%########...#######%%%%####........##########%%......%%###################"
  ] },
  { name: "DUSK STACK", adds: "DRIFTWOOD RAFTS", time: 99, water: [44.7, 44.7], rows: [
      "%%......................%%",
      "%%......................%%",
      "%%......................%%",
      "%%..............o..F....%%",
      "%%............##########%%",
      "%%......................%%",
      "%%..o.x.................%%",
      "%%#########.............%%",
      "%%......................%%",
      "%%......................%%",
      "%%................v.....%%",
      "%%.........o............%%",
      "%%.......-----..........%%",
      "%%.*....................%%",
      "%%#####.................%%",
      "%%......................%%",
      "%%...............o..g...%%",
      "%%..............########%%",
      "%%......r...............%%",
      "%%......................%%",
      "%%............%%........%%",
      "%%...h..o.....%%........%%",
      "%%--------....%%........%%",
      "%%............%%........%%",
      "%%............%%........%%",
      "%%............%%..o...o.%%",
      "%%..............########%%",
      "%%......................%%",
      "%%..........v...........%%",
      "%%......................%%",
      "%%.x..o.................%%",
      "%%######................%%",
      "%%......................%%",
      "%%.........o............%%",
      "%%........---...........%%",
      "%%......................%%",
      "%%..................g...%%",
      "%%................######%%",
      "%%......................%%",
      "%%..o.o........r........%%",
      "%%#######...............%%",
      "%%......................%%",
      "%%......................%%",
      "%%...P..................%%",
      "%%######################%%",
      "%%######################%%"
  ] },
];

// A level the crab cannot finish is a broken game: validate at load and throw into the error trap.
// Rises need no check (the crab climbs any wall); gaps do — a column with nothing to stand on, ride or climb.
function validateLevel(L, n) {
  const rows = L.rows, w = Math.max(...rows.map((r) => r.length)), count = (ch) => rows.join("").split(ch).length - 1;
  if (count("P") !== 1 || count("F") !== 1) throw new Error(`level ${n}: needs exactly one P and one F`);
  let run = 0;
  for (let c = 0; c < w; c++) {
    const bridged = rows.some((r) => (SOLID + ONEWAY + "rv").includes(r[c] || "."));
    run = bridged ? 0 : run + 1;
    if (run > 3) throw new Error(`level ${n}: a gap of ${run} tiles at column ${c} (max 3)`);
  }
}

let level = 1, score = 0, levelScore0 = 0, lastCam = { x: 0, y: 0 }, song = null;
let lvl, crab, pf, hp, gulls, shells, urchins, jellies, rafts, flag, pearl, crumbles, water, timeLeft, clear, dying, card, tWorld = 0;
const combo = { n: 0, t: 9 };

function buildLevel(n) {
  const L = LEVELS[n - 1]; validateLevel(L, n); level = n; tWorld = 0;
  lvl = GK.tilemap(L.rows, { tile: TILE, solid: SOLID, oneWay: ONEWAY, autotile: "4bit", paint: n === 3 ? PAINT_DUSK : PAINT });
  gulls = []; shells = []; urchins = []; jellies = []; rafts = []; crumbles = []; pearl = null; flag = null; clear = null; dying = null;
  for (const s of lvl.spawns) {
    const x = s.x, y = s.y;
    if (s.ch === "P") crab = { x: x + 2, y: y + 7, w: 12, h: 9, vx: 0, vy: 0, sx: 1, sy: 1, wall: 0, kick: 0, push: 0, spawn: { x: x + 2, y: y + 7 } };
    else if (s.ch === "o") shells.push({ x: x + 4, y: y + 4, w: 8, h: 8, ph: s.col * 0.7 });
    else if (s.ch === "*") pearl = { x: x + 5, y: y + 5, w: 7, h: 7, got: false };
    else if (s.ch === "x") urchins.push({ x: x + 4, y: y + 7, w: 8, h: 9 });
    else if (s.ch === "j") jellies.push({ x: x + 1, y: y + 8, w: 14, h: 8, sx: 1, sy: 1 });
    else if (s.ch === "g" || s.ch === "h") gulls.push(makeGull(s.ch === "h", x, y));
    else if (s.ch === "r" || s.ch === "v") rafts.push({ kind: s.ch, x0: x - 16, y0: y + 10, x: x - 16, y: y + 10, w: 48, h: 6, oneWay: true, dx: 0, dy: 0, ph: s.col * 0.9 });
    else if (s.ch === "F") flag = { x: x - 12, y: y - 24, w: 40, h: 40, col: s.col, row: s.row, raise: 0 };
  }
  for (const g of gulls) g.spr = gullSprite();
  hp = GK.health(3, { inv: 1.2, onDeath: () => die("ouch") });
  pf = GK.platformer(crab, { speed: FEEL.speed, accel: FEEL.accel, jump: FEEL.jump, gravity: FEEL.gravity, coyote: FEEL.coyote,
    buffer: FEEL.buffer, variableJump: true, maxJumps: 1, fallMul: FEEL.fallMul, maxFall: FEEL.maxFall,
    onJump: () => onJump(), onLand: () => onLand() });
  water = { y: L.water[0] * TILE, flood: false };
  timeLeft = L.time; crab.spr = crabSprite();
}
function makeGull(hover, x, y) {
  return hover ? { hover: true, x: x + 2, y: y + 4, x0: x + 2, y0: y + 4, w: 12, h: 9, vx: 0, vy: 0, ph: x * 0.013, face: 1, dead: false }
               : { hover: false, x: x + 2, y: y + 7, w: 12, h: 9, vx: -22, vy: 0, face: -1, dead: false };
}
const solidsNow = () => (rafts.length ? lvl.solids.concat(rafts) : lvl.solids);
const solidAt = (x, y) => { const ch = lvl.at(x, y); return !!ch && (SOLID + ONEWAY).includes(ch); };

// The world moves on the title, in play and behind the game-over card: gulls, rafts, the tide, crumbling castles.
function stepWorld(dt) {
  tWorld += dt; combo.t += dt;
  for (const r of rafts) {
    const ox = r.x, oy = r.y, k = Math.sin(tWorld * 0.9 + r.ph);
    if (r.kind === "r") r.x = r.x0 + k * 56; else r.y = r.y0 + k * 44;
    r.dx = r.x - ox; r.dy = r.y - oy;
  }
  for (const g of gulls) {
    if (g.dead) continue;
    if (g.hover) { if (stepSwoop(g, dt)) { g.spr.play("flap"); g.spr.update(dt); continue; } const nx = g.x0 + Math.sin(tWorld * 0.9 + g.ph) * 28; g.face = nx > g.x ? 1 : -1; g.x = nx; g.y = g.y0 + Math.sin(tWorld * 2.2 + g.ph) * 6; }
    else {
      g.vy = Math.min(g.vy + FEEL.gravity * dt, FEEL.maxFall); GK.moveSolid(g, lvl.solids, dt);
      const ahead = g.vx > 0 ? g.x + g.w + 1 : g.x - 1;
      if (g.hitWall || (g.onGround && !solidAt(ahead, g.y + g.h + 2))) { g.vx = g.face > 0 ? -22 : 22; }
      g.face = g.vx > 0 ? 1 : -1; if (g.vx === 0) g.vx = g.face * 22;
    }
    g.spr.play(g.hover ? "flap" : "walk"); g.spr.update(dt);
  }
  for (const j of jellies) j.sy = GK.lerp(j.sy, 1 + Math.sin(tWorld * 3 + j.x) * 0.06, 0.2);
  for (const cr of crumbles) {
    cr.t += dt;
    if (!cr.gone && cr.t > 0.45) { cr.gone = true; cr.t = 0; lvl.set(cr.c, cr.r, "."); onCrumble(cr); }
    else if (cr.gone && cr.t > 4 && !GK.hit(crab, { x: cr.c * TILE, y: cr.r * TILE, w: TILE, h: TILE })) { lvl.set(cr.c, cr.r, "c"); cr.done = true; onRebuild(cr); }
  }
  crumbles = crumbles.filter((cr) => !cr.done);
  const L = LEVELS[level - 1];
  if (!water.flood) water.y = GK.lerp(L.water[0], L.water[1], 1 - timeLeft / L.time) * TILE;
  stepTide(dt);                                                    // CLIMAX hook: the polish layer's tide lives there
}

function stepPlay(dt) {
  stepWorld(dt);
  if (clear) return stepClear(dt);
  if (dying) return stepDying(dt);
  timeLeft = Math.max(0, timeLeft - dt);
  if (timeLeft === 0 && !GOD && !water.flood) { water.flood = true; onFlood(); }
  if (water.flood) water.y -= 60 * dt;
  for (const r of rafts) if (crab.onGround && crab.groundRef === r) { crab.x += r.dx; crab.y += r.dy; }
  stepCrab(dt); checkCrumble();
  crab.x = GK.clamp(crab.x, 0, lvl.w - crab.w);
  // shells, the pearl, urchins, gulls, jellies, the flag — stomp is tested BEFORE damage
  for (const s of shells) if (!s.got && GK.hit(crab, s)) { s.got = true; score += 10; onShell(s); }
  if (pearl && !pearl.got && GK.hit(crab, pearl)) { pearl.got = true; score += 100; onPearl(pearl); }
  for (const u of urchins) if (GK.hit(crab, u)) hurt(u);
  for (const g of gulls) {
    if (g.dead || !GK.hit(crab, g)) continue;
    if (crab.vy > 0 && crab.y + crab.h - g.y < 8) { g.dead = true; crab.vy = -(GK.key.held("a") ? FEEL.stompHeld : FEEL.stomp); crab.wall = 0; score += 50; onStomp(g); }
    else hurt(g);
  }
  for (const j of jellies) if (crab.vy > 0 && GK.hit(crab, j) && crab.y + crab.h - j.y < 10) { crab.y = j.y - crab.h; crab.vy = -FEEL.spring; crab.wall = 0; onSpring(j); }
  if (flag && GK.hit(crab, flag)) { const bonus = Math.ceil(timeLeft) * 10; score += bonus; clear = { t: 0, bonus }; onClear(); }
  if (crab.y + crab.h > water.y + 5) { if (GOD) { crab.vy = -FEEL.spring * 0.9; onSplash(true); } else return die("water"); }
  if (crab.y > lvl.h + 32) { if (GOD) Object.assign(crab, { x: crab.spawn.x, y: crab.spawn.y, vx: 0, vy: 0 }); else return die("water"); }
  GK.score = score;
  GK.follow(crab, { level: lvl, lerp: 0.15, deadzone: { w: 20, h: 36 }, lookahead: { x: 36, y: 30 } });
}

// The signature verb: hold INTO a wall and the crab scuttles up it; jump kicks off; hold away lets go.
function stepCrab(dt) {
  const ax = GK.key.axisX();
  if (crab.wall) return stepWall(dt, ax);
  if (crab.kick > 0) {                                            // a wall kick or a knock-back: momentum, not steering
    crab.kick -= dt; crab.vy = Math.min(crab.vy + FEEL.gravity * (crab.vy > 0 ? FEEL.fallMul : 1) * dt, FEEL.maxFall);
    GK.moveSolid(crab, solidsNow(), dt);
  } else pf.step(dt, solidsNow());
  crab.push = crab.hitWall && ax !== 0 ? crab.push + dt : 0;
  if (crab.hitWall && ax !== 0 && (!crab.onGround || crab.push > 0.1) && crab.kick <= 0) { crab.wall = Math.sign(ax); crab.vy = 0; onGrab(); }
  crab.spr.play(!crab.onGround ? "jump" : Math.abs(crab.vx) > 8 ? "run" : "idle");
  crab.spr.update(dt);
}
function stepWall(dt, ax) {
  const d = crab.wall;
  if (GK.key.pressed("a")) { crab.wall = 0; crab.vx = -d * FEEL.kick; crab.vy = -FEEL.jump * 0.92; crab.kick = 0.16; onKick(d); return; }
  if (ax === -d) { crab.wall = 0; crab.vx = -d * 40; return; }
  const up = ax === d; crab.vx = d * 40; crab.vy = up ? -FEEL.climb : FEEL.slide;
  GK.moveSolid(crab, solidsNow(), dt);
  if (crab.onGround && !up) { crab.wall = 0; return; }
  if (!crab.hitWall) { crab.wall = 0; if (up) { crab.vy = -150; crab.vx = d * 70; crab.kick = 0.14; onLedge(d); } return; }
  crab.spr.play(up ? "run" : "idle"); crab.spr.update(up ? dt : dt * 0.3);
  if (up) onScuttle(dt, d);
}
function hurt(from) {
  if (GOD || dying || clear) return;
  if (!hp.hit(1)) return;
  const dir = Math.sign(GK.cx(crab) - GK.cx(from)) || 1;
  crab.wall = 0; crab.vx = dir * 140; crab.vy = -170; crab.kick = 0.22; onHurt(from);
}
function die(kind) {
  if (dying || clear) return;
  dying = { t: 0, kind }; crab.wall = 0; crab.vx = 0; crab.vy = kind === "water" ? 20 : -220; onDie(kind);
}
function stepDying(dt) {
  dying.t += dt;
  if (dying.kind === "water") { crab.y += 26 * dt; } else { crab.vy += FEEL.gravity * dt; crab.y += crab.vy * dt; }
  if (dying.t > 1.1) { lastCam = { x: GK.cam.x, y: GK.cam.y }; GK.gameOver({ score, kind: dying.kind, fx: "fade", fxTime: 0.3, fxColor: P[0] }); }
}
function stepClear(dt) {
  clear.t += dt; flag.raise = Math.min(1, clear.t / 0.8);
  crab.wall = 0; crab.vx = 0; crab.vy = Math.min(crab.vy + FEEL.gravity * dt, FEEL.maxFall); GK.moveSolid(crab, solidsNow(), dt);
  crab.spr.play("idle"); crab.spr.update(dt);
  if (clear.t > 1.6 && !clear.left) {
    clear.left = true; lastCam = { x: GK.cam.x, y: GK.cam.y };
    const at = { x: GK.cx(crab) - GK.cam.x, y: GK.cy(crab) - GK.cam.y };
    if (level < LEVELS.length) GK.go("play", { level: level + 1, keep: true }, { fx: "iris", time: 0.9, color: P[0], at });
    else GK.gameOver({ score, won: true, fx: "iris", fxTime: 0.9, fxColor: P[0] });
  }
}

GK.loadFont(FONT_FAMILY, FONT_URL, { id: "press" }).then((face) => {
  bakeArt(face);
  GK.start({
    kit: 2, slug: "crab-climb-dx", title: "Crab Climb DX",
    view: { mode: "pixel", width: 320, height: 180, orient: "landscape" },
    theme: THEME(face),
    controls: { layout: "lr+a", labels: { a: "JUMP" }, floating: false, size: 1.1, opacity: 0.85, skin: drawButton },
    stage: () => String(level), score: () => score,
    focus: () => ({ x: Math.round(crab.x), y: Math.round(crab.y), onGround: !!crab.onGround, wall: crab.wall }),
    entities: () => gulls.filter((g) => !g.dead).length + shells.filter((s) => !s.got).length + urchins.length + 1,
    textState: () => ({ level, lives: hp.hp, shells: shells.filter((s) => s.got).length, timeLeft: Math.ceil(timeLeft), tide: Math.round(water.y),
                        escape: escape ? { rising: escape.started, gap: Math.round(escape.y - crab.y - crab.h) } : null }),

// escape: on the dusk stack the tide stops being a clock and starts CLIMBING. It rubber-bands — it catches up when you
// are far above it and slows to a mercy crawl when it is right under your claws — and the music chases the waterline:
// the dusk song's tempo and filter track the gap. The tide gauge on the right shows the race; the flag at the top ends it.
const ESCAPE = { grace: 3.5, base: 14, mercy: 8, catchup: 0.12, far: 110, top: 5 * TILE, close: 48 };
let escape = null;
function stepTide(dt) {
  if (level !== 3 || GK.scene === "title") { escape = null; return; }
  if (!escape || escape.lvl !== lvl) escape = { lvl, t: 0, y: water.y, started: false, speed: 0, spray: 0, beat: 0, shout: 0 };
  if (GK.scene === "play" && !clear && !dying) {
    escape.t += dt;
    const gap = escape.y - (crab.y + crab.h);
    if (escape.t > ESCAPE.grace) {
      if (!escape.started) { escape.started = true; escape.shout = 2.2; onSurge(); }
      escape.speed = gap < ESCAPE.close ? ESCAPE.mercy : ESCAPE.base + Math.max(0, gap - ESCAPE.far) * ESCAPE.catchup;
      escape.y = Math.max(ESCAPE.top, escape.y - escape.speed * dt);
      escape.spray -= dt; if (escape.spray <= 0) { escape.spray = 0.12; GK.burst(GK.cam.x + GK.rand(0, GK.width), escape.y, { count: 2, color: [C.sea, C.white], speed: 70, angle: -Math.PI / 2, spread: 0.5, life: 0.5, size: 1, gravity: 320 }); }
      escape.beat -= dt; if (gap < ESCAPE.close && escape.beat <= 0) { escape.beat = 0.4; GK.sfx("tick"); GK.shake(1, 0.1); }
    }
    escape.shout = Math.max(0, escape.shout - dt);
    tideMusic(gap);
  }
  water.y = escape.y;
}
function tideMusic(gap) {
  if (song !== SONGS.dusk || !escape.started) return;
  const k = 1 - GK.clamp((gap - 30) / 170, 0, 1);                 // 0 = safe and high, 1 = the sea is at your legs
  song.bpm = Math.round(116 + 56 * k); song.intensity(0.3 + 0.7 * k);
}
function onSurge() { GK.sfx("surge"); GK.shake(3, 0.8); GK.flash(C.sea, 0.1); }
// the gauge: the whole stack as a pixel column — sea rising from the bottom, the crab, the flag at the top
function hudClimax(c) {
  if (level !== 3 || !escape) return;
  const r = GK.anchor("r", 10, 0), x = Math.round(r.x - 5), y0 = 32, h = 118, span = lvl.h - ESCAPE.top;
  const at = (wy) => Math.round(y0 + GK.clamp((wy - ESCAPE.top) / span, 0, 1) * h);
  const gap = escape.y - (crab.y + crab.h), hot = escape.started && gap < ESCAPE.close && Math.floor(tWorld * 6) % 2 === 0;
  c.fillStyle = hot ? C.red : C.night; c.fillRect(x - 1, y0 - 1, 7, h + 2);
  c.fillStyle = C.deep; c.fillRect(x, y0, 5, h);
  const wy = at(escape.y); c.fillStyle = C.blue; c.fillRect(x, wy, 5, y0 + h - wy); c.fillStyle = C.sea; c.fillRect(x, wy, 5, 1);
  c.fillStyle = C.red; c.fillRect(x + 1, y0 - 5, 4, 3); c.fillStyle = C.night; c.fillRect(x, y0 - 5, 1, 5);
  const cy = at(crab.y + crab.h); c.fillStyle = C.night; c.fillRect(x - 1, cy - 2, 7, 4); c.fillStyle = C.sunset; c.fillRect(x, cy - 1, 5, 2);
  if (escape.shout > 0) {
    GK.text("THE TIDE IS COMING!", GK.width / 2, 58, { font: ART.face, size: 8, color: C.sea, baseline: "top", shadow: { x: 1, y: 1, color: C.night } });
    if (Math.floor(tWorld * 5) % 2) GK.text("CLIMB!", GK.width / 2, 74, { size: 14, color: C.sand, stroke: C.night, wave: { amp: 1, speed: 8 } });
  }
}
// gulls that hover can see you: a squawk and a flashing "!" (0.6 s), then a U-shaped swoop through where you WERE
function stepSwoop(g, dt) {
  const s = g.sw || (g.sw = { phase: "idle", t: 0, cool: 1.5 });
  s.t += dt;
  if (s.phase === "idle") {
    s.cool -= dt; const dx = GK.cx(crab) - GK.cx(g), dy = crab.y - g.y;
    if (GK.scene === "play" && !dying && !clear && s.cool <= 0 && Math.abs(dx) < 72 && dy > 16 && dy < 120) { s.phase = "tele"; s.t = 0; GK.sfx("squawk"); }
    return false;
  }
  if (s.phase === "tele") { if (s.t > 0.6) Object.assign(s, { phase: "dive", t: 0, sx: g.x, sy: g.y, tx: crab.x, ty: crab.y - 2 }); return true; }
  if (s.phase === "dive") {
    const p = Math.min(1, s.t / 1.0); g.x = GK.lerp(s.sx, s.tx * 2 - s.sx, p); g.y = s.sy + (s.ty - s.sy) * Math.sin(Math.PI * p); g.face = s.tx > s.sx ? 1 : -1;
    if (p >= 1) Object.assign(s, { phase: "back", t: 0, bx: g.x, by: g.y }); return true;
  }
  const p = Math.min(1, s.t / 1.2), e = GK.ease.sineInOut(p); g.x = GK.lerp(s.bx, g.x0, e); g.y = GK.lerp(s.by, g.y0, e); g.face = g.x0 > s.bx ? 1 : -1;
  if (p >= 1) { s.phase = "idle"; s.cool = 2.5; g.ph = -tWorld * 0.9; }
  return true;
}
// the signature, deeper: kick from wall to wall without touching down and every kick in the chain scores more
function kickChain() {
  crab.kicks = (crab.kicks || 0) + 1;
  if (crab.kicks >= 2) { const b = 25 * (crab.kicks - 1); score += b; GK.float("KICK x" + crab.kicks + " +" + b, GK.cx(crab), crab.y - 8, { color: C.sea, size: 7, life: 0.8 }); }
}
