<script type="importmap">{"imports":{
  "three": "../../vendor/three/r170/three.module.min.js",
  "three/addons/": "../../vendor/three/r170/addons/"
}}</script>
<link rel="stylesheet" href="./lib-2/shell.css?v=1">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" hidden>
  <div id="hearts"><i>♥</i><i>♥</i><i>♥</i></div>
  <div id="score">0</div>
  <div id="frogs">0/8</div>
  <div id="meter"><b id="meter-fill"></b><span>FORCE</span></div>
  <div id="fuel"><b id="fuel-fill"></b></div>
</div>
<div id="msg" hidden></div>
<div id="controls" hidden>
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
  <button id="btn-force" aria-label="force">FORCE</button>
  <button id="btn-jump" aria-label="jetpack">JET</button>
  <button id="btn-blast" aria-label="blast">BLAST</button>
</div>

<section id="title" data-start>
  <p class="kicker">Mando &amp; Grogu in Blockland</p>
  <h1 class="title">Beskar Blocks</h1>
  <p class="by">a game by Alex</p>
  <p class="how">Grogu is hungry! Find 8 frogs · blast the Bucketheads · fly with your jetpack</p>
  <p id="prompt" class="prompt"></p>
</section>
<section id="over" data-start hidden>
  <h2 class="title">The Bucketheads got you!</h2>
  <p class="final"><span id="final">0</span></p>
  <p class="by">best <span id="best">0</span> · <span id="ate">0</span> frogs for Grogu</p>
  <p id="again" class="prompt">this is the way — again!</p>
</section>

<div id="flash"></div>
<div id="rotate" hidden>turn me sideways, bounty hunter!</div>
<a id="hub" hidden>← arcade</a>
<div id="err" role="alert" hidden></div>
<script type="module" src="main.js?v=2"></script>
</body>
</html>
