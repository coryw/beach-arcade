<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Crab Climb</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦀</text></svg>">
<style>
/* gk.css — the shell every game sits in. Fullscreen canvas, no scroll, no zoom, safe on iOS. */
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
canvas#game { display: block; position: fixed; inset: 0; touch-action: none; image-rendering: pixelated; }
#rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #0f172a; color: #fff; font: 700 28px system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px; }
@media (orientation: portrait) and (pointer: coarse) { body[data-orient="landscape"] #rotate { display: flex; } }
@media (orientation: landscape) and (pointer: coarse) { body[data-orient="portrait"] #rotate { display: flex; } }
/* kit 2: the page takes the game's own palette and face (GK.start sets --gk-*), and nothing is drawn under the notch. */
body[data-kit="2"], html:has(body[data-kit="2"]) { background: var(--gk-bg, #000); }
body[data-kit="2"] #rotate { background: var(--gk-bg, #000); color: var(--gk-ink, #fff); font: 900 28px var(--gk-font, system-ui);
  padding: calc(24px + var(--sa-top-override, env(safe-area-inset-top, 0px))) calc(24px + var(--sa-right-override, env(safe-area-inset-right, 0px)))
           calc(24px + var(--sa-bottom-override, env(safe-area-inset-bottom, 0px))) calc(24px + var(--sa-left-override, env(safe-area-inset-left, 0px))); }
#gk-safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none; }

</style>
</head>
<body data-orient="landscape">
<div id="rotate">📱↻<br>Turn your phone sideways to play!</div>
<canvas id="game"></canvas>
<script>
/*! gk.js v2 — the game-maker 2D kit. One file, no dependencies, no build step. Global: window.GK.
 *  Canvas 2D · fixed-step loop (hitstop, slowmo) · test hooks (render_game_to_text, advanceTime, __arcade) ·
 *  seeded RNG · keyboard + touch + gamepad · scenes + transitions · tilemaps + platformer · sprites · tweens ·
 *  painters, parallax, light, post · particles + trails · synthesized sfx + songs · high scores.
 *  kit 1 (the default) is every legacy game, unchanged. GK.start({kit: 2, theme, view, ...}) opts into the identity
 *  layer: no shared title, game-over, banner or control skin — the game draws its own. API: kit/README.md.
 */
(function () {
  "use strict";
  const GK = { version: "2.0.0", kit: 1, ready: false, lastError: null,
               stats: { frames: 0, renders: 0, time: 0, stepMs: 0, inputs: {} } };
  const STEP = 1 / 60, TAU = Math.PI * 2;
  let opts = {}, K2 = false, theme = null;

  // ───────────────────────────── URL parameters (§3.1) ─────────────────────────────
  // ?seed=N ?arcade=1 ?q=N ?nobloom=1 ?god=1 ?at=<stage> ?sa=T,R,B,L — the names every v2 game honors.
  const qs = new URLSearchParams(location.search);
  const num = (k) => (qs.has(k) && qs.get(k) !== "" && isFinite(+qs.get(k)) ? +qs.get(k) : null);
  const flag = (k) => qs.has(k) && qs.get(k) !== "0" && qs.get(k) !== "false";
  const saRaw = qs.has("sa") ? qs.get("sa").split(",").map(Number) : null;
  GK.params = { seed: num("seed"), arcade: flag("arcade"), q: num("q"), nobloom: flag("nobloom"), god: flag("god"),
                at: qs.get("at"), sa: saRaw && saRaw.length === 4 && saRaw.every(isFinite) ? saRaw : null, raw: qs };

  // ───────────────────────────── random & math ─────────────────────────────
  // Game randomness is Math.random until GK.seed(n) (or ?seed=N) switches it to mulberry32 — and then Math.random is
  // patched too, so game code that calls it directly is deterministic under the gate. Kit visuals (shake, grain,
  // tiles, stars, sfx variation) never draw from this stream: they use hash noise, so rendering cannot shift the game.
  let rnd = Math.random;
  const mulberry32 = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
  GK.rng = mulberry32;
  GK.seed = (n) => { rnd = mulberry32(Math.floor(Number(n)) || 0); Math.random = rnd; return rnd; };
  if (GK.params.seed !== null) GK.seed(GK.params.seed);
  GK.random = () => rnd();
  GK.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  GK.lerp = (a, b, t) => a + (b - a) * t;
  GK.rand = (a = 1, b) => (b === undefined ? rnd() * a : a + rnd() * (b - a));
  GK.randInt = (a, b) => Math.floor(GK.rand(a, b + 1));
  GK.pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  GK.chance = (p) => rnd() < p;
  GK.dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  GK.angleTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
  GK.wrap = (v, min, max) => (v < min ? max - (min - v) : v > max ? min + (v - max) : v);
  GK.sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
  GK.approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  const mod = (a, n) => ((a % n) + n) % n;

  // hash noise: deterministic, never touches the game's random stream. noise1/noise2 return 0..1.
  const hash2 = (x, y) => { let h = Math.imul(x | 0, 374761393) ^ Math.imul((y | 0) + 0x9E3779B9, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
  const smooth = (t) => t * t * (3 - 2 * t);
  GK.noise1 = (x) => { const i = Math.floor(x); return GK.lerp(hash2(i, 0), hash2(i + 1, 0), smooth(x - i)); };
  GK.noise2 = (x, y) => { const i = Math.floor(x), j = Math.floor(y), fx = smooth(x - i), fy = smooth(y - j);
    return GK.lerp(GK.lerp(hash2(i, j), hash2(i + 1, j), fx), GK.lerp(hash2(i, j + 1), hash2(i + 1, j + 1), fx), fy); };
  const noiseP = (x, period, seed) => { const i = Math.floor(x); return GK.lerp(hash2(mod(i, period), seed), hash2(mod(i + 1, period), seed), smooth(x - i)); };
  const fbmP = (x, period, seed, oct = 3) => { let v = 0, a = 0.5, f = 1, n = 0; for (let o = 0; o < oct; o++) { v += a * noiseP(x * f, period * f, seed + o * 17); n += a; a *= 0.5; f *= 2; } return v / n; };

  GK.ease = {
    linear: (t) => t, quadIn: (t) => t * t, quadOut: (t) => t * (2 - t), quadInOut: (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2),
    cubicIn: (t) => t * t * t, cubicOut: (t) => 1 - (1 - t) ** 3, cubicInOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2),
    sineInOut: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    backIn: (t) => 2.70158 * t * t * t - 1.70158 * t * t, backOut: (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2,
    elasticOut: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
    bounceOut: (t) => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
      if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; },
  };

  // colors: parse "#rgb" "#rrggbb" "#rrggbbaa" "rgb()/rgba()" → {r,g,b,a}; mix two colors; lighten (+) / darken (−)
  const colorCache = new Map();
  GK.color = (c) => {
    if (colorCache.has(c)) return colorCache.get(c); let r = 255, g = 255, b = 255, a = 1, m;
    if (typeof c === "string" && c[0] === "#") { let h = c.slice(1); if (h.length <= 4) h = [...h].map((x) => x + x).join("");
      r = parseInt(h.slice(0, 2), 16); g = parseInt(h.slice(2, 4), 16); b = parseInt(h.slice(4, 6), 16); if (h.length >= 8) a = parseInt(h.slice(6, 8), 16) / 255; }
    else if (typeof c === "string" && (m = /rgba?\(([^)]+)\)/.exec(c))) { const p = m[1].split(/[ ,/]+/).filter(Boolean).map(parseFloat); [r, g, b] = p; if (p.length > 3) a = p[3]; }
    const o = { r, g, b, a }; if (colorCache.size < 512) colorCache.set(c, o); return o;
  };
  const hex2 = (v) => Math.round(GK.clamp(v, 0, 255)).toString(16).padStart(2, "0");
  GK.mix = (c1, c2, t) => { const a = GK.color(c1), b = GK.color(c2), al = GK.lerp(a.a, b.a, t);
    return "#" + hex2(GK.lerp(a.r, b.r, t)) + hex2(GK.lerp(a.g, b.g, t)) + hex2(GK.lerp(a.b, b.b, t)) + (al < 1 ? hex2(al * 255) : ""); };
  GK.shade = (c, amt) => GK.mix(c, amt >= 0 ? "#ffffff" : "#000000", Math.abs(amt));
  GK.alpha = (c, a) => { const o = GK.color(c); return `rgba(${o.r},${o.g},${o.b},${a * o.a})`; };

  // center-of-box helpers (entities are {x,y,w,h}; x,y is the TOP-LEFT corner)
  GK.cx = (e) => e.x + e.w / 2;
  GK.cy = (e) => e.y + e.h / 2;
  GK.hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  GK.hitCircle = (a, b) => Math.hypot(GK.cx(a) - GK.cx(b), GK.cy(a) - GK.cy(b)) < (a.r || Math.min(a.w, a.h) / 2) + (b.r || Math.min(b.w, b.h) / 2);
  GK.contains = (e, px, py) => px >= e.x && px <= e.x + e.w && py >= e.y && py <= e.y + e.h;
  GK.inBounds = (e, pad = 0) => e.x + e.w >= -pad && e.x <= GK.width + pad && e.y + e.h >= -pad && e.y <= GK.height + pad;

  // ───────────────────────────── canvas, view & sizing ─────────────────────────────
  // view.mode: "fit" (kit 1 and default: fixed logical size, letterboxed) · "expand" (short side fixed, the long side
  // grows up to maxAspect, so a phone has no bars; GK.width/GK.height change and opts.onResize(w, h) runs) ·
  // "pixel" (a width×height buffer, integer upscale, nearest-neighbour).
  let canvas, mainCtx, ctx, dpr = 1, scale = 1, offX = 0, offY = 0, viewW = 0, viewH = 0, buf = null, bufCtx = null;
  let tgt = { ox: 0, oy: 0, w: 1, h: 1 }, baseT = [1, 0, 0, 1, 0, 0];
  GK.width = 800; GK.height = 450; GK.cam = { x: 0, y: 0, zoom: 1, rot: 0 };
  GK.view = { mode: "fit" };
  GK.isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
  const isPixel = () => GK.view.mode === "pixel";

  function resize() {
    viewW = window.innerWidth; viewH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(viewW * dpr); canvas.height = Math.round(viewH * dpr);
    canvas.style.width = viewW + "px"; canvas.style.height = viewH + "px";
    const v = GK.view, pw = GK.width, ph = GK.height;
    if (v.mode === "expand") {
      if (v.orient === "portrait") { GK.width = v.width; GK.height = Math.round(GK.clamp(v.width * viewH / viewW, v.height, v.width * v.maxAspect)); }
      else { GK.height = v.height; GK.width = Math.round(GK.clamp(v.height * viewW / viewH, v.width, v.height * v.maxAspect)); }
    }
    const fitScale = Math.min(viewW / GK.width, viewH / GK.height);
    scale = v.mode === "pixel" && fitScale >= 1 ? Math.floor(fitScale) : fitScale;
    offX = (viewW - GK.width * scale) / 2; offY = (viewH - GK.height * scale) / 2;
    if (v.mode === "pixel") { offX = Math.floor(offX); offY = Math.floor(offY); }
    GK.scale = scale;
    if (document.body) readSafe();
    if (K2) buildControls();
    if ((pw !== GK.width || ph !== GK.height || !resize.done) && opts.onResize) { try { opts.onResize(GK.width, GK.height); } catch (e) { fail(e); } }
    resize.done = true;
  }
  GK.toGame = (clientX, clientY) => ({ x: (clientX - offX) / scale, y: (clientY - offY) / scale });
  // The painted view in CSS px. With letterbox ART (theme.letterbox is a function) the game paints the whole screen.
  GK.viewRect = () => (K2 && typeof theme.letterbox === "function" ? { x: 0, y: 0, w: viewW, h: viewH } : { x: offX, y: offY, w: GK.width * scale, h: GK.height * scale });

  // Safe-area insets from a probe div (env(safe-area-inset-*)); ?sa=T,R,B,L fakes them through --sa-*-override.
  // GK.safeCss = the screen's insets in CSS px; GK.safe = how far they reach INTO the view, in logical px.
  GK.safe = { top: 0, right: 0, bottom: 0, left: 0 }; GK.safeCss = { top: 0, right: 0, bottom: 0, left: 0 };
  let safeProbe = null;
  function readSafe() {
    if (!safeProbe) {
      safeProbe = document.createElement("div"); safeProbe.id = "gk-safe";
      safeProbe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;" +
        ["top", "right", "bottom", "left"].map((k) => `padding-${k}:var(--sa-${k}-override, env(safe-area-inset-${k}, 0px))`).join(";");
      document.body.appendChild(safeProbe);
    }
    if (GK.params.sa) ["top", "right", "bottom", "left"].forEach((k, i) => document.documentElement.style.setProperty(`--sa-${k}-override`, GK.params.sa[i] + "px"));
    const cs = getComputedStyle(safeProbe), px = (k) => parseFloat(cs[`padding${k}`]) || 0;
    const s = { top: px("Top"), right: px("Right"), bottom: px("Bottom"), left: px("Left") }; GK.safeCss = s;
    const vw = GK.width * scale, vh = GK.height * scale;
    GK.safe = { top: Math.max(0, s.top - offY) / scale, left: Math.max(0, s.left - offX) / scale,
                bottom: Math.max(0, s.bottom - (viewH - offY - vh)) / scale, right: Math.max(0, s.right - (viewW - offX - vw)) / scale };
  }
  // A point inside the view that stays clear of the safe-area insets: HUD placement. corner: tl tr bl br t b l r c.
  GK.anchor = (corner = "tl", dx = 0, dy = 0) => {
    const s = GK.safe, W = GK.width, H = GK.height, c = corner;
    const x = c.includes("l") ? s.left + dx : c.includes("r") ? W - s.right - dx : W / 2 + dx;
    const y = c.includes("t") ? s.top + dy : c.includes("b") ? H - s.bottom - dy : H / 2 + dy;
    return { x, y };
  };

  // ───────────────────────────── input ─────────────────────────────
  // Names: left right up down a b start.  key = ANY player; p1/p2 = specific players.
  // Every key action, virtual-button hit, zone touch, stick drag and tap is counted in GK.stats.inputs[name].
  const KEYMAP = {
    any: { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
           KeyA: "left", KeyD: "right", KeyW: "up", KeyS: "down",
           Space: "a", KeyZ: "a", KeyJ: "a", KeyF: "a", KeyK: "b", KeyX: "b", KeyG: "b", ShiftLeft: "b", ShiftRight: "b", KeyL: "b",
           Enter: "start", NumpadEnter: "start", Escape: "start" },
    p1:  { KeyA: "left", KeyD: "right", KeyW: "up", KeyS: "down", KeyF: "a", KeyG: "b", Space: "a", Enter: "start" },
    p2:  { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", KeyK: "a", KeyL: "b", Slash: "a", Period: "b", Enter: "start" },
  };
  function makeInput() {
    const held = new Set(), pressed = new Set(), released = new Set();
    return {
      held: (n) => held.has(n), pressed: (n) => pressed.has(n), released: (n) => released.has(n),
      axisX() { return (held.has("right") ? 1 : 0) - (held.has("left") ? 1 : 0); },
      axisY() { return (held.has("down") ? 1 : 0) - (held.has("up") ? 1 : 0); },
      _down(n) { if (!held.has(n)) pressed.add(n); held.add(n); },
      _up(n) { if (held.has(n)) released.add(n); held.delete(n); },
      _tick() { pressed.clear(); released.clear(); },
      _clear() { held.clear(); pressed.clear(); released.clear(); },
    };
  }
  GK.key = makeInput(); GK.p1 = makeInput(); GK.p2 = makeInput();
  GK.anyPressed = () => ["a", "b", "start"].some((n) => GK.key.pressed(n)) || GK.pointer.justDown;
  GK.pointer = { x: 0, y: 0, down: false, justDown: false, justUp: false };
  GK.touches = []; // [{id,x,y}] live touches in game coords (excludes virtual-control touches)
  const touchQueue = []; // taps this frame: [{x,y}]
  GK.taps = [];
  const count = (n) => { GK.stats.inputs[n] = (GK.stats.inputs[n] || 0) + 1; };

  function keyDown(e) {
    if (e.repeat) return;
    if (KEYMAP.any[e.code]) count(KEYMAP.any[e.code]);
    for (const who of ["any", "p1", "p2"]) { const n = KEYMAP[who][e.code]; if (n) GK[who === "any" ? "key" : who]._down(n); }
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
    unlockAudio();
  }
  function keyUp(e) {
    for (const who of ["any", "p1", "p2"]) { const n = KEYMAP[who][e.code]; if (n) GK[who === "any" ? "key" : who]._up(n); }
  }

  // gamepads: pad 0 → p1 (+any), pad 1 → p2 (+any)
  const padState = [{}, {}];
  function pollPads() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < 2; i++) {
      const pad = pads && pads[i]; const who = i === 0 ? GK.p1 : GK.p2; if (!pad) continue;
      const ax = pad.axes[0] || 0, ay = pad.axes[1] || 0;
      const now = {
        left: ax < -0.5 || (pad.buttons[14] && pad.buttons[14].pressed), right: ax > 0.5 || (pad.buttons[15] && pad.buttons[15].pressed),
        up: ay < -0.5 || (pad.buttons[12] && pad.buttons[12].pressed), down: ay > 0.5 || (pad.buttons[13] && pad.buttons[13].pressed),
        a: pad.buttons[0] && pad.buttons[0].pressed, b: (pad.buttons[1] && pad.buttons[1].pressed) || (pad.buttons[2] && pad.buttons[2].pressed),
        start: pad.buttons[9] && pad.buttons[9].pressed,
      };
      for (const n in now) {
        if (now[n] && !padState[i][n]) { who._down(n); GK.key._down(n); count(n); }
        if (!now[n] && padState[i][n]) { who._up(n); GK.key._up(n); }
      }
      padState[i] = now;
    }
  }

  // ───────────────────────────── virtual touch controls ─────────────────────────────
  // layouts: 'dpad+ab' (default) · 'lr+a' (left/right + jump) · 'joystick+ab' · 'tap' (none drawn) · 'none'
  // kit 1: buttons live in GAME coords (the legacy positions). kit 2: buttons live in CSS px, anchored to the screen's
  // thumb corners outside the safe-area insets, and the game's skin function draws them. `zones` are invisible touch
  // regions that press an action while held (view fractions).
  const vc = { layout: "dpad+ab", buttons: [], zones: [], zoneSpecs: [], active: {}, stick: null, visible: false, touched: false,
               space: "game", skin: null, labels: {}, icons: {}, floating: false, opacity: 0.55, size: 1 };
  const LEGACY_LABEL = { left: "◀", right: "▶", up: "▲", down: "▼", a: "A", b: "B" };
  function buildControls() {
    const held = vc.stick && vc.stick.id !== null ? vc.stick : null;
    vc.buttons = []; vc.stick = null;
    if (vc.space === "css") buildControlsCss();
    else {
      const W = GK.width, H = GK.height, r = 34;
      if (vc.layout === "dpad+ab" || vc.layout === "joystick+ab") {
        if (vc.layout === "dpad+ab") {
          const cx = 90, cy = H - 90, d = 52;
          vc.buttons.push({ n: "left", x: cx - d, y: cy, r, label: "◀" }, { n: "right", x: cx + d, y: cy, r, label: "▶" },
                          { n: "up", x: cx, y: cy - d, r, label: "▲" }, { n: "down", x: cx, y: cy + d, r, label: "▼" });
        } else vc.stick = { cx: 100, cy: H - 100, r: 60, dx: 0, dy: 0, id: null };
        vc.buttons.push({ n: "a", x: W - 70, y: H - 70, r: 38, label: "A" }, { n: "b", x: W - 150, y: H - 110, r: 32, label: "B" });
      } else if (vc.layout === "lr+a") {
        vc.buttons.push({ n: "left", x: 70, y: H - 70, r: 40, label: "◀" }, { n: "right", x: 170, y: H - 70, r: 40, label: "▶" },
                        { n: "a", x: W - 70, y: H - 70, r: 44, label: "A" });
      }
      for (const b of vc.buttons) { b.kind = "button"; if (vc.labels[b.n] !== undefined) b.label = vc.labels[b.n]; b.icon = vc.icons[b.n] ?? null; }
    }
    if (held && vc.stick) Object.assign(vc.stick, { dx: held.dx, dy: held.dy, id: held.id, counted: held.counted });
    vc.zones = vc.zoneSpecs.map((z) => ({ n: z.n, rect: z.rect }));

    for (const k of ["bg", "ink", "accent", "good", "bad", "gold", "shade"]) req(typeof t.palette[k] === "string", `theme.palette.${k} is required — decide the art direction`);
    req(t.font && t.font.display && t.font.ui, "theme.font {display, ui} is required — decide the art direction");
    req(!(t.sound && t.sound.preset) && typeof o.sound !== "string", "sound presets (chip soft arcade toy) are kit 1 only — define every sound with GK.sfx.def");
    const c = typeof o.controls === "object" && o.controls ? o.controls : { layout: o.controls || "dpad+ab" };
    if (typeof c.skin === "string") throw new Error(`kit 2: controls.skin must be a function (ctx, btn, on) — the string '${c.skin}' is a kit 1 skin`);
    req(["tap", "none"].includes(c.layout) || typeof c.skin === "function", "controls.skin must be a function (ctx, btn, on) — the game draws its own buttons");
    req(o.scenes && o.scenes.title && o.scenes.gameover, "register your own 'title' and 'gameover' scenes (kit 2 has no shared screens)");
    const v = o.view || {};
    req(!v.mode || ["fit", "expand", "pixel"].includes(v.mode), `view.mode '${v.mode}' — use fit, expand or pixel`);
  }
  GK.start = (o) => {
    if (o.kit === 2) validateKit2(o);
    opts = o; GK.opts = o; K2 = o.kit === 2; GK.kit = K2 ? 2 : 1; theme = K2 ? o.theme : null; GK.theme = theme;
    const v = o.view || {}, portrait = (v.orient || o.orient) === "portrait";
    GK.view = { mode: v.mode || "fit", width: v.width || o.width || (portrait ? 450 : 800), height: v.height || o.height || (portrait ? 800 : 450),
                maxAspect: v.maxAspect ?? 2.4, orient: v.orient || o.orient || ((v.width || o.width || 800) >= (v.height || o.height || 450) ? "landscape" : "portrait") };
    GK.width = GK.view.width; GK.height = GK.view.height;
    if (K2) { delete GK.titleScene; delete GK.gameOverScene; delete GK.banner; if (theme.sound && theme.sound.seed !== undefined) soundRng = mulberry32(theme.sound.seed); }
    document.title = o.title || document.title;
    canvas = document.getElementById("game") || document.body.appendChild(Object.assign(document.createElement("canvas"), { id: "game" }));
    mainCtx = ctx = canvas.getContext("2d");
    if (GK.view.mode === "pixel") { buf = document.createElement("canvas"); buf.width = GK.width; buf.height = GK.height; bufCtx = ctx = buf.getContext("2d"); bufCtx.imageSmoothingEnabled = false; }
    const c = typeof o.controls === "object" && o.controls ? o.controls : { layout: o.controls };
    Object.assign(vc, { layout: c.layout || "dpad+ab", skin: c.skin ?? null, labels: c.labels || {}, icons: c.icons || {}, floating: !!c.floating,
                        opacity: c.opacity ?? (K2 ? 0.4 : 0.55), size: c.size ?? 1, zoneSpecs: c.zones || [], space: K2 ? "css" : "game" });
    if (!K2) buildControls();
    vc.visible = GK.isTouch && vc.layout !== "none";
    scenes = K2 ? Object.assign({}, o.scenes) : Object.assign({ title: defaultTitle(), gameover: defaultGameOver() }, o.scenes || {});
    for (const n in scenes) if (scenes[n] && scenes[n].drawHud === undefined && scenes[n].hud) scenes[n].drawHud = scenes[n].hud;
    if (K2) { document.body.dataset.kit = "2"; const rs = document.documentElement.style; rs.setProperty("--gk-bg", theme.palette.bg); rs.setProperty("--gk-ink", theme.palette.ink);
      rs.setProperty("--gk-font", typeof theme.font.display === "string" ? theme.font.display : GK.fonts.chunky); }
    resize(); window.addEventListener("resize", resize); window.addEventListener("orientationchange", () => setTimeout(resize, 100));
    window.addEventListener("keydown", keyDown); window.addEventListener("keyup", keyUp);
    canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId); pointerDown(e.pointerId, e.clientX, e.clientY, e.pointerType === "touch"); e.preventDefault(); });
    canvas.addEventListener("pointermove", (e) => { pointerMove(e.pointerId, e.clientX, e.clientY); e.preventDefault(); });
    for (const ev of ["pointerup", "pointercancel"]) canvas.addEventListener(ev, (e) => { pointerUp(e.pointerId); e.preventDefault(); });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("visibilitychange", () => { paused = document.hidden && !!o.pauseOnHide; if (document.hidden) { GK.key._clear(); GK.p1._clear(); GK.p2._clear(); } });

    document.addEventListener("touchmove", (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", (e) => e.preventDefault());

  };
  window.GK = GK;
})();

</script>
<script>
// Crab Climb — exemplar PLATFORMER (ASCII level, gravity, coins, patrolling enemies, spikes, a goal flag)
const T = 40;
const LEVEL = [
  "........................................................",
  "........................................................",
  "..............c.c.c.....................................",
  "..........................####.........c.c.c...........F",
  ".........c.c..........................######...........#",
  "........#####.......e..........^^........................",
  "....................####.....#####.........e..........###",
  "..P........e...................................####.....",
  "#######..#######.......c.c.........^^^^.........^^......",
  "#######..#######..###########....#######....##########..",
  "########^########^###########^^^^#######^^^^##########^^",
];
const CRAB = GK.pixelArt([
  "..R....R..", ".RR....RR.", "..RRRRRR..", ".RRWRRWRR.", "RRRRRRRRRR", ".RRRRRRRR.", "R.R.RR.R.R", "..R....R..",
], { R: "#ef4444", W: "#fff" }, 4);
const GULL = GK.pixelArt([
  "..WW......", ".WWWW.....", "WWWWWWWWW.", ".WWWWWWWWW", "..WWWWWW..", "....OO....",
], { W: "#f8fafc", O: "#f59e0b" }, 4);

let lvl, player, coins, enemies, spikes, flag, score, lives, timeLeft;

function spawn() {
  player = { x: 0, y: 0, w: 34, h: 30, vx: 0, vy: 0, onGround: false, face: 1, inv: 0 };
  coins = []; enemies = []; spikes = [];
  for (const s of lvl.spawns) {
    if (s.ch === "P") { player.x = s.x + 3; player.y = s.y + 10; }
    if (s.ch === "c") coins.push({ x: s.x + 8, y: s.y + 8, w: 24, h: 24, t: Math.random() * 6 });
    if (s.ch === "e") enemies.push({ x: s.x, y: s.y + 8, w: 40, h: 24, vx: 70, dir: 1, startX: s.x });
    if (s.ch === "^") spikes.push({ x: s.x + 4, y: s.y + 20, w: T - 8, h: T - 20 });
    if (s.ch === "F") flag = { x: s.x + 4, y: s.y - 20, w: 32, h: 60 };
  }
}
function hurt() {
  if (player.inv > 0) return;
  lives--; GK.sfx("hit"); GK.shake(8, 0.3); GK.burst(GK.cx(player), GK.cy(player), { color: ["#ef4444", "#fff"], count: 16 });
  if (lives <= 0) return GK.gameOver({ score, message: "The seagulls got you!" });
  player.inv = 1.5; player.vy = -420; player.vx = -player.face * 200;
}

GK.start({
  title: "Crab Climb", by: "the game-maker kit", icon: "🦀", slug: "crab-climb",
  width: 800, height: 450, bg: "#7dd3fc", controls: "lr+a",
  howTo: ["◀ ▶ or A / D to run · Space or A to jump", "Grab the shells, dodge the gulls, reach the flag!"],
  scenes: {
    play: {
      enter() { lvl = GK.level(LEVEL, T); score = 0; lives = 3; timeLeft = 90; spawn(); GK.every(1, () => { timeLeft--; if (timeLeft <= 0) GK.gameOver({ score, message: "Out of time!" }); }); },
      update(dt) {
        const p = player, ax = GK.key.axisX();
        p.vx = GK.approach(p.vx, ax * 260, (p.onGround ? 2200 : 1200) * dt);
        if (ax) p.face = ax;
        p.vy += 1400 * dt; if (p.vy > 700) p.vy = 700;
        if (GK.key.pressed("a") && p.onGround) { p.vy = -560; GK.sfx("jump"); GK.burst(GK.cx(p), p.y + p.h, { color: "#fde68a", count: 6, speed: 90, gravity: 200 }); }
        if (GK.key.released("a") && p.vy < -200) p.vy = -200; // short hop
        GK.moveSolid(p, lvl.solids, dt);
        if (p.inv > 0) p.inv -= dt;
        if (p.y > lvl.h + 100) { lives = 1; hurt(); if (lives > 0) spawn(); }
        for (const c of coins) c.t += dt;
        coins = coins.filter((c) => { if (GK.hit(p, c)) { score += 10; GK.sfx("coin"); GK.float("+10", GK.cx(c), c.y, { color: "#fde68a" }); GK.burst(GK.cx(c), GK.cy(c), { color: "#fde68a", count: 8, speed: 120 }); return false; } return true; });
        for (const e of enemies) {
          e.x += e.vx * e.dir * dt; e.y += Math.sin(GK.sceneTime() * 4 + e.startX) * 20 * dt;
          if (e.x > e.startX + 120 || e.x < e.startX - 120) e.dir *= -1;
          if (GK.hit(p, e)) {
            if (p.vy > 0 && p.y + p.h < e.y + e.h * 0.6) { e.dead = true; p.vy = -380; score += 25; GK.sfx("bounce"); GK.float("+25", GK.cx(e), e.y, { color: "#fff" }); GK.burst(GK.cx(e), GK.cy(e), { color: ["#fff", "#f59e0b"], count: 14 }); }
            else hurt();
          }
        }
        enemies = enemies.filter((e) => !e.dead);
        for (const s of spikes) if (GK.hit(p, s)) hurt();
        if (flag && GK.hit(p, flag)) { score += Math.round(timeLeft * 5); GK.gameOver({ score, won: true, message: `You reached the flag with ${timeLeft}s to spare!` }); }
        GK.follow(p, { level: lvl });
      },
      draw(ctx) {
        // sky decorations (parallax-ish clouds) and sea at the bottom
        for (let i = 0; i < 8; i++) GK.emoji("☁️", 120 + i * 300 - GK.cam.x * 0.3, 60 + (i % 3) * 40, 48);
        GK.rect(0, lvl.h - 6, lvl.w, 60, "#0284c7");
        for (const s of lvl.solids) { GK.rect(s.x, s.y, s.w, s.h, "#fbbf24"); GK.rect(s.x, s.y, s.w, 6, "#fde68a"); }
        for (const s of spikes) GK.emoji("🔺", GK.cx(s), GK.cy(s) + 4, 26);
        for (const c of coins) GK.emoji("🐚", GK.cx(c), GK.cy(c) + Math.sin(c.t * 5) * 3, 24);
        for (const e of enemies) GK.img(GULL, e.x, e.y, e.w, e.h, { flipX: e.dir < 0 });
        if (flag) GK.emoji("🚩", GK.cx(flag), GK.cy(flag), 44);
        if (player.inv <= 0 || Math.floor(GK.sceneTime() * 12) % 2 === 0) GK.img(CRAB, player.x - 3, player.y - 2, 40, 32, { flipX: player.face < 0 });
      },
      drawHud() {
        GK.text(`🐚 ${score}`, 16, 24, { align: "left", size: 24, stroke: "#000" });
        GK.text("❤️".repeat(lives), GK.width - 16, 24, { align: "right", size: 22 });
        GK.text(`⏱ ${timeLeft}`, GK.width / 2, 24, { size: 22, stroke: "#000" });
      },
    },
  },
});
</script>
