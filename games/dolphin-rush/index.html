<!-- Dolphin Rush by Ryan · 3d · runner-3d · look "Sunset Lagoon Leap" (lowpoly-pastel) · climax chase · started 2026-09-24
     The idea, verbatim (DESIGN.md keeps the original): You are a dolphin racing through the ocean as fast as you can. You jump through hoops for points and dodge jellyfish and sharks, and it keeps getting faster. At the end a giant octopus tries to grab you. -->
<script type="importmap">{"imports":{
  "three": "../../vendor/three/r170/three.module.min.js",
  "three/addons/": "../../vendor/three/r170/addons/"
}}</script>
<link rel="stylesheet" href="./lib-1/shell.css?v=1">
<link rel="stylesheet" href="style.css?v=1">

<body>
<canvas id="view"></canvas>

<div id="hud" hidden><span id="score">0</span><span id="combo"></span></div>
<div id="controls" hidden><div id="swipe"></div></div>

<section id="title" data-start>
  <h1 class="title">Dolphin Rush</h1>
  <p class="by">by Ryan</p>
  <p class="how">swipe ⬅ ➡ to swim · ⬆ to leap · ⬇ to dive</p>
  <p id="prompt" class="prompt"></p>
</section>
<section id="over" data-start hidden>
  <h2 class="title" id="overmsg">splash!</h2>
  <p class="final"><span id="final">0</span></p>
  <p class="by">best <span id="best">0</span></p>
  <p id="again" class="prompt">swim again!</p>
</section>

<div id="rotate" hidden>🐬 turn me portrait!</div>
<a id="hub" hidden>← arcade</a>
<div id="err" role="alert" hidden></div>
<script type="module" src="main.js?v=2"></script>
</body>
